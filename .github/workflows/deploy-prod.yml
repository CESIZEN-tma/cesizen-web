name: Deploy - Production

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run syntax

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  build-and-push:
    name: Build & Push Docker image (prod)
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cesizen-web:prod
            ghcr.io/${{ github.repository_owner }}/cesizen-web:latest
          build-args: |
            VITE_API_URL=${{ secrets.PROD_API_URL }}
            VITE_API_KEY=${{ secrets.PROD_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
